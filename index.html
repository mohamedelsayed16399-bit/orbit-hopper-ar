<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>قفّاز المدارات</title>
<style>
html,body{margin:0;height:100%;background:#05030f;overflow:hidden;font-family:system-ui,Tahoma,sans-serif;color:#fff;touch-action:none;-webkit-user-select:none;user-select:none}
canvas{display:block;width:100%;height:100%}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(5,3,20,.82);text-align:center;padding:16px;overflow:auto}
.ov.hide{display:none}
h1{margin:0 0 4px;font-size:40px;background:linear-gradient(90deg,#7cf,#f7c,#fd6);-webkit-background-clip:text;color:transparent}
p{margin:6px 0;opacity:.9;line-height:1.5;max-width:340px}
button{font:inherit;font-size:20px;font-weight:700;color:#fff;background:linear-gradient(135deg,#6a4bff,#e03a9a);border:0;border-radius:14px;padding:12px 34px;margin:8px;box-shadow:0 4px 18px #e03a9a55}
button.s{font-size:15px;padding:8px 18px;background:#2a2550;box-shadow:none}
.ships{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap;justify-content:center}
.ship{width:64px;padding:6px 2px;border-radius:12px;background:#1a1640;border:2px solid #3a3470;font-size:11px}
.ship.sel{border-color:#fd6}.ship.lock{opacity:.45}
.ship canvas{width:40px;height:40px;margin:auto}
</style></head><body>
<canvas id="c"></canvas>
<div class="ov" id="menu">
<h1>قفّاز المدارات</h1>
<p>أنت في مدار كوكب. دوس على الشاشة تنطلق في خط مستقيم، وقرّب من كوكب تاني عشان الجاذبية تمسكك. طلّع لفوق أعلى ما تقدر.</p>
<p>⚠️ الكوكب بينهار بعد كام ثانية، متفضلش كتير. الثقوب السوداء بتبلعك. خد النجوم والدروع.</p>
<div id="best"></div>
<div class="ships" id="ships"></div>
<button id="play">ابدأ</button>
<button class="s" id="snd">🔊 الصوت: شغال</button>
</div>
<div class="ov hide" id="over"><h1>خلصت!</h1><p id="res"></p><button id="again">العب تاني</button><button class="s" id="tomenu">القايمة</button></div>
<script>
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,DPR;function rs(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0)}rs();addEventListener('resize',rs);
const SAVE='orbit_hopper_v1';let save={best:0,stars:0,ship:0,snd:1};try{Object.assign(save,JSON.parse(localStorage.getItem(SAVE)||'{}'))}catch(e){}
function persist(){try{localStorage.setItem(SAVE,JSON.stringify(save))}catch(e){}}
const SHIPS=[{n:'الكشّاف',c:'#7cf',cost:0},{n:'النار',c:'#f96',cost:15},{n:'الزمرد',c:'#6f9',cost:40},{n:'الملكي',c:'#fd6',cost:80},{n:'الشبح',c:'#c8f',cost:150}];
// audio
let AC=null;function beep(f,d,t,v,sl){if(!save.snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),gn=AC.createGain();o.type=t||'sine';o.frequency.value=f;if(sl)o.frequency.exponentialRampToValueAtTime(Math.max(30,f*sl),AC.currentTime+d);gn.gain.value=v||.06;gn.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+d);o.connect(gn);gn.connect(AC.destination);o.start();o.stop(AC.currentTime+d)}catch(e){}}
const R=(a,b)=>a+Math.random()*(b-a);
let S;// state
let stars=[];for(let i=0;i<120;i++)stars.push({x:Math.random(),y:Math.random(),z:R(.1,.6),s:R(.6,2)});
function newGame(){S={t:0,px:0,py:0,vx:0,vy:0,state:'orbit',cur:null,ang:0,dir:1,orR:0,planets:[],items:[],parts:[],camY:0,top:0,score:0,starsGot:0,combo:0,shield:0,magnet:0,dead:false,genY:0,hops:0,shake:0,msgs:[],trail:[],hopsNoCrumble:0,lastCur:null};
 const p=mkPlanet(0,0,'normal');p.r=34;p.ring=70;S.planets.push(p);S.cur=p;S.genY=0;S.orR=p.ring-6;S.ang=Math.PI/2;S.px=0;S.py=S.orR;p.life=1;
 for(let i=0;i<6;i++)gen();}
let uid=1;
function mkPlanet(x,y,type){const r=type==='hole'?R(20,28):R(22,40);return{id:uid++,x,y,bx:x,r,ring:r+R(34,50),type,hue:R(0,360),life:1,ph:R(0,6),amp:type==='mover'?R(50,110):0,sp:R(.6,1.2),used:false}}
function gen(){const lvl=S.hops;const gap=Math.min(150+lvl*3,260);S.genY+=R(gap*.8,gap*1.1);
 const half=Math.min(W,420)/2-50;let type='normal';const r=Math.random();
 if(lvl>4&&r<.22)type='mover';if(lvl>8&&r>.86)type='hole';
 const x=R(-half,half);const p=mkPlanet(x,S.genY,type);S.planets.push(p);
 if(type==='hole'){// ensure a normal one nearby
   const q=mkPlanet(R(-half,half),S.genY+R(40,90),'normal');S.planets.push(q)}
 // items
 if(Math.random()<.7){const s=S.items.push({x:p.x+R(-90,90),y:p.y+R(60,140),k:Math.random()<.1?'shield':Math.random()<.08?'magnet':'star',a:1})}
 if(lvl>6&&Math.random()<.3){S.items.push({x:R(-half,half),y:S.genY+R(80,150),k:'mine',a:1,ph:R(0,6)})}}
function pos(p){return p.type==='mover'?p.bx+Math.sin(S.t*p.sp+p.ph)*p.amp:p.x}
function burst(x,y,col,n,sp){for(let i=0;i<n;i++){const a=R(0,6.28),v=R(.3,1)*(sp||160);S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:R(.4,.9),m:.9,c:col,s:R(1.5,4)})}}
function msg(t,c){S.msgs.push({t,c:c||'#fff',l:1.4})}
function launch(){if(S.state!=='orbit')return;const p=S.cur;const sp=330+Math.min(S.hops*6,140);
 const A0=absPos();S.px=A0.x;S.py=A0.y;const tx=-Math.sin(S.ang)*S.dir,ty=Math.cos(S.ang)*S.dir;S.vx=tx*sp;S.vy=ty*sp;S.state='fly';S.lastCur=p;S.leave=S.t;beep(520,.18,'triangle',.07,2);burst(S.px,S.py,'#fff',8,90);}
function capture(p){S.state='orbit';S.cur=p;const dx=S.px-pos(p),dy=S.py-p.y;const d=Math.hypot(dx,dy);S.orR=Math.max(p.r+14,Math.min(d,p.ring));S.ang=Math.atan2(dy,dx);
 // direction from cross product
 const cr=dx*S.vy-dy*S.vx;S.dir=cr>=0?1:-1;S.px=pos(p)-pos(p);// we store position relative to planet
 S.px=Math.cos(S.ang)*S.orR;S.py=Math.sin(S.ang)*S.orR;p.life=1;
 if(!p.used){p.used=true;S.hops++;S.combo=Math.min(S.combo+1,10);const gain=10*S.combo;S.score+=gain;beep(300+S.combo*40,.2,'sine',.08);msg('+'+gain+(S.combo>1?'  كومبو x'+S.combo:''),'#fd6');burst(pos(p),p.y,'hsl('+p.hue+',90%,65%)',16,200)}
 else{S.combo=0}}
// world coords for player: orbit => relative, fly => absolute. unify with absolute
function absPos(){return S.state==='orbit'?{x:pos(S.cur)+S.px,y:S.cur.y+S.py}:{x:S.px,y:S.py}}
function die(why){if(S.dead)return;if(S.shield>0&&why!=='out'){S.shield=0;burst(absPos().x,absPos().y,'#7cf',24,260);beep(200,.3,'square',.08,.5);msg('الدرع اتكسر','#7cf');S.shield=0;S.invuln=1.2;if(S.state==='fly'){const a=absPos();/*bounce away*/S.vx*=-.5;S.vy=Math.abs(S.vy)*.5+80}return}
 if(S.invuln>0&&why!=='out')return;S.dead=true;S.shake=1;const a=absPos();burst(a.x,a.y,SHIPS[save.ship].c,40,300);beep(140,.7,'sawtooth',.1,.3);
 save.stars+=S.starsGot;const sc=Math.floor(S.score+S.top/10);S.final=sc;const nb=sc>save.best;if(nb)save.best=sc;persist();
 setTimeout(()=>{document.getElementById('res').innerHTML='النتيجة: <b>'+sc+'</b><br>أعلى نتيجة: '+save.best+(nb?' 🏆 رقم قياسي جديد!':'')+'<br>⭐ '+S.starsGot+' (إجمالي '+save.stars+')<br>مدارات: '+S.hops+(why==='crumble'?'<br>الكوكب انهار عليك':why==='hole'?'<br>ثقب أسود بلعك':why==='mine'?'<br>لغم':why==='out'?'<br>خرجت من المجال':'');document.getElementById('over').classList.remove('hide')},900)}
let running=false,last=0;
function step(dt){S.t+=dt;if(S.invuln>0)S.invuln-=dt;
 for(const p of S.planets){if(p.type==='mover')p.x=pos(p)}
 if(!S.dead){
 if(S.state==='orbit'){const p=S.cur;const w=(260/S.orR)*S.dir*(p.type==='mover'?1:1);S.ang+=w*dt*.9;S.px=Math.cos(S.ang)*S.orR;S.py=Math.sin(S.ang)*S.orR;
  p.life-=dt/(p.type==='normal'?(4.2-Math.min(S.hops*.04,1.6)):3);if(p.life<=0){die('crumble');p.dead=true}
  if(p.type==='hole'){die('hole')}
  const a=absPos();S.trail.push({x:a.x,y:a.y,l:.5});}
 else{ // fly with gravity
  let ax=0,ay=0;for(const p of S.planets){if(p.dead)continue;const dx=pos(p)-S.px,dy=p.y-S.py,d=Math.hypot(dx,dy)||1;
   const reach=p.type==='hole'?p.ring*2.2:p.ring*1.8;if(d<reach){const f=(p.type==='hole'?9000:5200)*(p.r/30)/(d*.8+40);ax+=dx/d*f;ay+=dy/d*f}
   if(p.type==='hole'&&d<p.r*0.9){die('hole')}
   if(d<p.r*.85&&p.type!=='hole'&&!(p===S.lastCur&&S.t-S.leave<.5)){die('crumble')}
   else if(d<p.ring&&d>p.r*.85&&p.type!=='hole'&&!(p===S.lastCur&&S.t-S.leave<.45)&&!p.dead){capture(p);break}}
  if(S.state==='fly'){S.vx+=ax*dt;S.vy+=ay*dt;if(S.magnet>0){}S.px+=S.vx*dt;S.py+=S.vy*dt;S.trail.push({x:S.px,y:S.py,l:.6});
   if(S.py<S.camY-H*.7&&S.t-S.leave>0.5||Math.abs(S.px)>Math.max(W,420)*1.1||S.py<S.top-H*1.2)die('out');
   if(S.t-S.leave>4.5)die('out')}}
 const a=absPos();
 if(a.y>S.top)S.top=a.y;
 // items
 for(const it of S.items){if(it.a<=0)continue;const dx=it.x-a.x,dy=it.y-a.y,d=Math.hypot(dx,dy);
  if(S.magnet>0&&it.k==='star'&&d<200){it.x-=dx/d*300*dt;it.y-=dy/d*300*dt}
  if(d<24){it.a=0;if(it.k==='star'){S.starsGot++;S.score+=5;beep(880,.12,'sine',.06);burst(it.x,it.y,'#fd6',8,120)}else if(it.k==='shield'){S.shield=1;msg('درع 🛡️','#7cf');beep(600,.3,'triangle',.07)}else if(it.k==='magnet'){S.magnet=8;msg('مغناطيس 🧲','#f7c');beep(500,.3,'triangle',.07)}else if(it.k==='mine'){die('mine');burst(it.x,it.y,'#f55',20,200)}}}
 if(S.magnet>0)S.magnet-=dt;
 // generate
 while(S.genY<S.top+H*1.4)gen();
 }
 for(const t of S.trail)t.l-=dt;S.trail=S.trail.filter(t=>t.l>0);
 for(const p of S.parts){p.x+=p.vx*dt;p.y+=p.vy*dt;p.l-=dt}S.parts=S.parts.filter(p=>p.l>0);
 for(const m of S.msgs)m.l-=dt;S.msgs=S.msgs.filter(m=>m.l>0);
 S.shake=Math.max(0,S.shake-dt*2);
 const a=S.dead?{y:S.camY+H*.3}:absPos();const ty=Math.max(S.camY,a.y-H*.35);S.camY+=(ty-S.camY)*Math.min(1,dt*5);
 S.planets=S.planets.filter(p=>p.y>S.camY-H*.9);S.items=S.items.filter(i=>i.y>S.camY-H*.9&&i.a>0||(i.a>0&&false));}
function sy(y){return H*.65-(y-S.camY)}
function sx(x){return W/2+x}
function drawShip(ctx,x,y,rot,col,sz){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col;ctx.beginPath();ctx.moveTo(0,-sz);ctx.lineTo(sz*.7,sz*.8);ctx.lineTo(0,sz*.4);ctx.lineTo(-sz*.7,sz*.8);ctx.closePath();ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(0,-sz*.1,sz*.22,0,6.3);ctx.fill();ctx.restore()}
function draw(){g.setTransform(DPR,0,0,DPR,0,0);
 const gr=g.createLinearGradient(0,0,0,H);const h=(S.camY/40)%360;gr.addColorStop(0,'hsl('+(250+Math.sin(S.camY/900)*40)+',60%,8%)');gr.addColorStop(1,'hsl('+(280+Math.sin(S.camY/700)*40)+',70%,16%)');g.fillStyle=gr;g.fillRect(0,0,W,H);
 g.save();if(S.shake>0)g.translate(R(-6,6)*S.shake,R(-6,6)*S.shake);
 for(const s of stars){const y=((s.y*H+S.camY*s.z)%H);g.globalAlpha=.4+s.z;g.fillStyle='#fff';g.fillRect(s.x*W,H-y,s.s,s.s)}g.globalAlpha=1;
 // planets
 for(const p of S.planets){const x=sx(pos(p)),y=sy(p.y);if(y<-150||y>H+150)continue;
  if(p.type==='hole'){const gr2=g.createRadialGradient(x,y,2,x,y,p.ring*1.6);gr2.addColorStop(0,'#000');gr2.addColorStop(.35,'#000');gr2.addColorStop(.5,'rgba(190,60,255,.7)');gr2.addColorStop(1,'rgba(60,0,100,0)');g.fillStyle=gr2;g.beginPath();g.arc(x,y,p.ring*1.6,0,6.3);g.fill();g.strokeStyle='#d6f';g.lineWidth=2;g.beginPath();g.arc(x,y,p.r,S.t*3,S.t*3+4.5);g.stroke();continue}
  const col='hsl('+p.hue+',70%,55%)';
  g.strokeStyle='rgba(255,255,255,'+(p.used?.1:.28)+')';g.setLineDash([5,7]);g.lineWidth=1.5;g.beginPath();g.arc(x,y,p.ring,0,6.3);g.stroke();g.setLineDash([]);
  const sg=g.createRadialGradient(x-p.r*.3,y-p.r*.3,2,x,y,p.r);sg.addColorStop(0,'hsl('+p.hue+',80%,75%)');sg.addColorStop(1,'hsl('+p.hue+',70%,32%)');g.fillStyle=sg;g.beginPath();g.arc(x,y,p.r*(.4+.6*Math.max(0,Math.min(1,p.life))),0,6.3);g.fill();
  if(p.type==='mover'){g.strokeStyle='#fd6';g.lineWidth=2;g.beginPath();g.arc(x,y,p.r+5,0,6.3);g.stroke()}
  if(S.cur===p&&S.state==='orbit'){g.strokeStyle=p.life<.35?'#f55':'#7f9';g.lineWidth=4;g.beginPath();g.arc(x,y,p.ring+6,-1.57,-1.57+6.28*Math.max(0,p.life));g.stroke()}}
 // items
 for(const it of S.items){if(it.a<=0)continue;const x=sx(it.x),y=sy(it.y);if(y<-30||y>H+30)continue;g.font='20px sans-serif';g.textAlign='center';g.textBaseline='middle';
  if(it.k==='star'){g.fillStyle='#fd6';g.beginPath();for(let i=0;i<10;i++){const r=i%2?5:11,a=-1.57+i*.628;g.lineTo(x+Math.cos(a+S.t)*r,y+Math.sin(a+S.t)*r)}g.fill()}
  else if(it.k==='mine'){g.fillStyle='#f44';g.beginPath();g.arc(x,y,9,0,6.3);g.fill();g.strokeStyle='#f88';g.lineWidth=2;for(let i=0;i<8;i++){const a=i*.785+S.t*2;g.beginPath();g.moveTo(x+Math.cos(a)*9,y+Math.sin(a)*9);g.lineTo(x+Math.cos(a)*15,y+Math.sin(a)*15);g.stroke()}}
  else g.fillText(it.k==='shield'?'🛡️':'🧲',x,y)}
 // trail
 for(const t of S.trail){g.globalAlpha=Math.max(0,t.l);g.fillStyle=SHIPS[save.ship].c;g.beginPath();g.arc(sx(t.x),sy(t.y),3*t.l+1,0,6.3);g.fill()}g.globalAlpha=1;
 // ship
 if(!S.dead){const a=absPos();let rot;if(S.state==='orbit')rot=S.ang+(S.dir>0?Math.PI:0)+(S.dir>0?0:0)+(S.dir>0?0:Math.PI)+Math.PI/2*0;else rot=Math.atan2(S.vy,S.vx)+Math.PI/2;
  if(S.state==='orbit')rot=Math.atan2(Math.cos(S.ang)*S.dir,-Math.sin(S.ang)*S.dir)+Math.PI/2;
  if(S.invuln>0&&Math.floor(S.t*14)%2)g.globalAlpha=.4;drawShip(g,sx(a.x),sy(a.y),rot,SHIPS[save.ship].c,13);g.globalAlpha=1;
  if(S.shield>0){g.strokeStyle='#7cf';g.lineWidth=2;g.beginPath();g.arc(sx(a.x),sy(a.y),20,0,6.3);g.stroke()}
  if(S.magnet>0){g.strokeStyle='rgba(255,120,200,.5)';g.beginPath();g.arc(sx(a.x),sy(a.y),200*(.8+.2*Math.sin(S.t*8)),0,6.3);g.stroke()}}
 for(const p of S.parts){g.globalAlpha=Math.max(0,p.l/p.m);g.fillStyle=p.c;g.fillRect(sx(p.x)-p.s/2,sy(p.y)-p.s/2,p.s,p.s)}g.globalAlpha=1;
 g.restore();
 // HUD
 g.fillStyle='#fff';g.font='700 26px system-ui';g.textAlign='center';g.textBaseline='top';g.fillText(Math.floor(S.score+S.top/10),W/2,14);
 g.font='14px system-ui';g.fillText('⭐ '+S.starsGot+'   |   أعلى: '+save.best,W/2,46);
 if(S.state==='orbit'&&S.hops<2&&!S.dead){g.font='700 18px system-ui';g.globalAlpha=.7+.3*Math.sin(S.t*5);g.fillText('دوس عشان تنطلق 👆',W/2,H*.82);g.globalAlpha=1}
 let my=90;for(const m of S.msgs){g.globalAlpha=Math.min(1,m.l);g.fillStyle=m.c;g.font='700 18px system-ui';g.fillText(m.t,W/2,my);my+=22}g.globalAlpha=1}
function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0.016);last=ts;step(dt);draw();requestAnimationFrame(loop)}
function start(){document.getElementById('menu').classList.add('hide');document.getElementById('over').classList.add('hide');newGame();running=true;last=performance.now();requestAnimationFrame(loop)}
function toMenu(){running=false;document.getElementById('over').classList.add('hide');document.getElementById('menu').classList.remove('hide');renderMenu()}
function renderMenu(){document.getElementById('best').innerHTML='أعلى نتيجة: <b>'+save.best+'</b> · ⭐ '+save.stars;const el=document.getElementById('ships');el.innerHTML='';SHIPS.forEach((s,i)=>{const d=document.createElement('div');const un=save.stars>=s.cost||save.own&&save.own[i];d.className='ship'+(save.ship===i?' sel':'')+(un?'':' lock');const c=document.createElement('canvas');c.width=c.height=80;drawShip(c.getContext('2d'),40,42,0,s.c,24);d.appendChild(c);d.appendChild(document.createTextNode(s.n+(un?'':' ⭐'+s.cost)));d.onclick=()=>{if(un){save.ship=i;persist();renderMenu()}};el.appendChild(d)});document.getElementById('snd').textContent=save.snd?'🔊 الصوت: شغال':'🔇 الصوت: مقفول'}
document.getElementById('play').onclick=start;document.getElementById('again').onclick=start;document.getElementById('tomenu').onclick=toMenu;
document.getElementById('snd').onclick=()=>{save.snd=save.snd?0:1;persist();renderMenu()};
function tap(e){if(!running||!S||S.dead)return;launch()}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap()});addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();tap()}});
renderMenu();newGame();S.dead=false;draw();
window.__t={start,state:()=>S,tap,step:(n)=>{for(let i=0;i<n;i++)step(1/60)},draw};
</script></body></html>
